name: Linting and Testing

on:
  push:
    branches:
      - PersonalProjTS
  pull_request:
    branches:
      - PersonalProjTS
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      USERDB_PATH: ${{ secrets.USERDB_PATH }}
      PARTSDB_PATH: ${{ secrets.PARTSDB_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up NodeJS
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./Backend
        run: npm install

      - name: Run ESLint
        working-directory: ./Backend
        run: npm run lint

      - name: Debug Environment Variables
        working-directory: ./Backend
        run: |
          echo "USERDB_PATH=${USERDB_PATH}"
          echo "PARTSDB_PATH=${PARTSDB_PATH}"

      - name: Run tests
        working-directory: ./Backend
        run: npm test -- --coverage
